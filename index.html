<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>tog | Café & Roastery</title>
    <style>
        :root {
            --primary: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --card-bg: rgba(15, 23, 42, 0.9);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(245, 158, 11, 0.3);
            --input-bg: rgba(30, 41, 59, 0.9);
            --shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #172033 50%, #1e1b18 100%);
            margin: 0; padding: 12px; color: var(--text-color);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .container {
            width: 100%; max-width: 440px; background: var(--card-bg);
            padding: 24px 20px; border-radius: 20px; box-shadow: var(--shadow);
            border: 1px solid var(--border-color); margin: 20px auto;
        }
        h2, h3 { text-align: center; margin-top: 0; font-size: 20px; }
        .input-group { margin: 14px 0; }
        input {
            width: 100%; padding: 14px 16px; border: 2px solid var(--border-color);
            border-radius: 12px; font-size: 14px; outline: none; background: var(--input-bg); color: var(--text-color);
        }
        button {
            width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px;
            font-size: 14px; font-weight: 700; cursor: pointer; border: none; color: white;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-in { background-color: var(--success); }
        .btn-out { background-color: var(--danger); }
        .btn-admin { background-color: var(--primary); }
        .status { text-align: center; font-weight: 600; margin: 12px 0; padding: 10px; background: rgba(16, 185, 129, 0.15); color: #34d399; border-radius: 10px; font-size: 12px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container" id="employeeView">
        <h2>☕ نظام الحضور الذكي</h2>
        <div class="status">🛡️ مزمّن سحابياً مع الإدارة وبصمة الجهاز</div>
        
        <div class="input-group">
            <input type="text" id="employeeName" placeholder="أدخل اسمك الثلاثي">
        </div>

        <button class="btn-in" onclick="registerAttendance('تسجيل حضور')">✨ تسجيل حضور</button>
        <button class="btn-out" onclick="registerAttendance('تسجيل انصراف')">🚪 تسجيل انصراف</button>
        
        <div style="margin-top:20px; border-top:1px dashed var(--border-color); padding-top:15px;">
            <button class="btn-admin" onclick="showAdminLogin()">🔐 دخول لوحة المدير (الإكسل)</button>
        </div>
    </div>

    <div class="container hidden" id="adminLoginView">
        <h3>دخول المدير</h3>
        <div class="input-group">
            <input type="password" id="adminPassword" placeholder="كلمة المرور">
        </div>
        <button class="btn-admin" onclick="verifyAdmin()">دخول</button>
        <button class="btn-logout" style="background:#64748b;" onclick="hideAdminLogin()">إلغاء</button>
    </div>

    <div class="container hidden" id="adminDashboardView" style="max-width: 500px;">
        <h3 style="color: var(--primary);">📊 لوحة التحكم السحابية</h3>
        <p style="font-size:13px; color:var(--text-muted); text-align:center;">جميع السجلات تذهب مباشرة إلى ملف Google Sheets الخاص بك وتظهر هناك فوراً!</p>
        <button class="btn-admin" onclick="window.open('https://docs.google.com/spreadsheets', '_blank')">📂 فتح ملف الإكسل السحابي</button>
        <button class="btn-logout" style="background:#64748b; margin-top:15px;" onclick="logoutAdmin()">🚪 عودة</button>
    </div>

<script>
    // ضع هنا رابط Web App الخاص بك بين القوسين أدناه:
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxouDR7d53yHHo3Lgq0uTkcfjnRjEgJ7zHQ7ECthHZ1O3C2cI4WhBLUcsWWevjCqCObqQ/exec";

    let myDeviceId = localStorage.getItem('myDeviceId');
    if (!myDeviceId) {
        myDeviceId = 'dev_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('myDeviceId', myDeviceId);
    }

    function getMobileDeviceType() {
        const ua = navigator.userAgent;
        if (/iphone|ipad|ipod/i.test(ua)) return "iPhone / iOS";
        if (/android/i.test(ua)) return "Android Phone";
        if (/windows/i.test(ua)) return "Windows PC";
        if (/mac/i.test(ua)) return "Mac Computer";
        return "Smart Device";
    }

    function showAdminLogin() {
        document.getElementById('employeeView').classList.add('hidden');
        document.getElementById('adminLoginView').classList.remove('hidden');
    }
    function hideAdminLogin() {
        document.getElementById('adminLoginView').classList.add('hidden');
        document.getElementById('employeeView').classList.remove('hidden');
    }
    function verifyAdmin() {
        if (document.getElementById('adminPassword').value === "safa24ms") {
            document.getElementById('adminLoginView').classList.add('hidden');
            document.getElementById('adminDashboardView').classList.remove('hidden');
        } else {
            alert("كلمة المرور غير صحيحة!");
        }
    }
    function logoutAdmin() {
        document.getElementById('adminDashboardView').classList.add('hidden');
        document.getElementById('employeeView').classList.remove('hidden');
    }

    function registerAttendance(type) {
        let name = document.getElementById('employeeName').value.trim();
        if (!name) {
            alert("الرجاء إدخال اسمك أولاً!");
            return;
        }

        let lastRegistered = localStorage.getItem('last_reg_name');
        if(lastRegistered === name) {
            alert("لقد قمت بتسجيل الحضور مسبقاً من هذا الجهاز!");
            return;
        }

        const now = new Date();
        const data = {
            name: name,
            type: type,
            time: now.toLocaleString('ar-SA'),
            status: type === 'تسجيل حضور' ? 'في الموعد' : 'انصراف',
            device: getMobileDeviceType(),
            points: type === 'تسجيل حضور' ? 1 : 0
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(() => {
            localStorage.setItem('last_reg_name', name);
            alert(`✅ تم ${type} بنجاح وسُجل في نظام الإدارة الفوري!`);
            document.getElementById('employeeName').value = '';
        }).catch(error => {
            alert("حدث خطأ في الاتصال بالشبكة، تأكد من الإنترنت.");
        });
    }
</script>

</body>
</html>
